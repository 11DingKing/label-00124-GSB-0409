services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gnss-timing-simulation
    ports:
      - "8081:8080"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
